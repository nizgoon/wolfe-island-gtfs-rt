name: Poll Wolfe Island ferry status

on:
  schedule:
    # GitHub Actions cron has a practical minimum granularity of ~5 minutes
    # and can lag further under load -- fine for a ferry, not for anything
    # sub-minute.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll 511 Ontario and regenerate feed
        run: python wolfe_island_gtfs_rt.py --once

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gtfs-rt-alerts.pb
          git diff --staged --quiet || git commit -m "Update ferry alert feed"
          git push
